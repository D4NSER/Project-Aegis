name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux Tkinter support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          python3 -c "import tkinter"
      - name: Install macOS Tkinter support
        if: runner.os == 'macOS'
        run: |
          python_minor=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          brew install "python-tk@$python_minor"
          python3 -c "import tkinter"
      - name: Test control logic and repository boundary
        run: python3 -m unittest discover -s tests -v
      - name: Inspect indexed files and committed history
        run: python3 scripts/check_repository.py --history
      - name: Check desktop JavaScript syntax
        run: node --check src/desktop_ui/app.js
      - name: Compile native macOS host
        if: runner.os == 'macOS'
        run: >-
          clang -fobjc-arc src/mac_app.m -framework Cocoa -framework WebKit
          -o "$RUNNER_TEMP/aegis-control"
